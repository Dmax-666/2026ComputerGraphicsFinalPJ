name: concept_art_board
description: Generate a concept art exploration board with multiple design variations for a single subject.
workflow: visual_composition

models:
  planner:
    provider: mock
    model: mock-planner
  critic:
    provider: mock
    model: mock-vision-critic
  image:
    provider: mock
    model: mock-image-generator

agents:
  - planner
  - style_director
  - image_generator
  - critic
  - revision_controller

assets:
  types:
    - concept_variation
  variations_per_subject: 4
  subjects:
    - character
    - environment

render:
  type: asset_sheet
  page_size: [2000, 1200]
  margin: 64
  gutter: 32
  background: "#1a1a2e"

revision:
  max_rounds: 2
  retry_budget_per_asset: 1
  quality_threshold: 0.7

evaluators:
  - style_consistency
  - image_size
  - file_sanity

outputs:
  save_intermediate: true
  save_final_image: true
  save_report: true
