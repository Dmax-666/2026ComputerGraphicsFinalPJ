[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graphic-agent"
version = "0.1.0"
description = "A configurable agentic framework for visual content generation tasks."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "2026 Computer Graphics Final Project Team" }
]
dependencies = [
  "pydantic>=2.0,<3.0",
  "PyYAML>=6.0",
  "Pillow>=10.0",
  "typer>=0.12",
  "rich>=13.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6"
]

[project.scripts]
graphic-agent = "graphic_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
